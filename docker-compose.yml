services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - PYTHONPATH=/app/backend
    volumes:
      - ./backend:/app/backend
    restart: unless-stopped

  worker:
    build: .
    command: >
      python -c "print('Optional 3D worker placeholder. Process PENDING jobs via POST /models3d/{id}/process or a cron.')"
    env_file:
      - backend/.env
    profiles:
      - worker
    restart: "no"

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    depends_on:
      - api
    profiles:
      - frontend
